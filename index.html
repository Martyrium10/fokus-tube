<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fokus-Tube</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <header class="kopfzeile">
      <div class="kopf-links">
        <h1>Fokus-Tube</h1>
        <p id="status" class="status">Noch keine Videos geladen.</p>
        <p id="fehler" class="fehler"></p>
      </div>
      <img src="favicon.svg" alt="Fokus-Tube Logo" class="logo" />
      <div class="kopf-knoepfe">
        <button id="google-knopf" class="google-knopf">
          ☁ Mit Google verbinden
        </button>
        <button id="neu-laden-knopf" class="neu-laden-knopf">
          ↻ Aktualisieren
        </button>
      </div>
    </header>

    <main>
      <!-- Bereich für den Player -->
      <section class="player-bereich">
        <div class="player-rahmen">
          <div id="player">Hier läuft später das Video.</div>
        </div>
        <h2 id="player-titel" class="player-titel"></h2>
        <div class="tempo-leiste">
          <span>Tempo:</span>
          <button class="tempo-knopf" data-tempo="1">1x</button>
          <button class="tempo-knopf" data-tempo="1.25">1,25x</button>
          <button class="tempo-knopf" data-tempo="1.5">1.5x</button>
          <button class="tempo-knopf" data-tempo="1.75">1.75x</button>
          <button class="tempo-knopf" data-tempo="2">2x</button>
          <button id="kino-knopf" class="kino-knopf">▭ Kinomodus</button>
          <button id="fertig-knopf" class="fertig-knopf">
            ✓ Fertig gesehen
          </button>
        </div>
      </section>

      <!-- Liste der neuen Videos -->
      <section>
        <h2>Neue Videos</h2>
        <ul id="video-liste" class="video-liste"></ul>
      </section>
    </main>

    <script src="app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
  </body>
</html>
